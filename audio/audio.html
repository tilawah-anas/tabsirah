<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio | Tabsirah</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="/css/reader.css">
  <style type="text/tailwindcss">
    @font-face {
      font-family: "Roboto";
      src: url(fonts/Roboto-VariableFont_wdth\,wght.ttf);
    }

    @font-face {
      font-family: "A Suls-Regular";
      src: url(fonts/A\ Suls-Regular.ttf);
    }

    @theme {
      --color-primary: #f9f7f1;
      --color-hover-pri: #f1edd9;
      --color-secondary: #1a2a40;
      --color-hover-sec: #101b2a;
      --font-display: 'Roboto', serif;
      --font-logo: 'A Suls-Regular';
    }
  </style>
</head>
<body class="bg-primary font-display">
  
  <header>

    <nav class="flex justify-between items-center text-primary px-8 bg-secondary w-full h-15 border-b-primary">

      <!-- NAV LEFT -->
      <div class="flex flex-col items-center">
        <img src="../assets/logo-pri.png" class="w-16 md:w-20" alt="tasbirah logo">
      </div>

      <!-- NAV CENTER -->
      <div class="hidden md:flex justify-between items-center gap-15">
        <a href="../index.html" data-nav="home" class="hover:underline">
          <i class="fa-solid fa-house"></i>
          <span>Home</span>
        </a>
        <a href="/quran/" data-nav="quran" class="hover:underline">
          <i class="fa-solid fa-book-quran"></i>
          <span>Quran</span>
        </a>
        <a href="/audio/" data-nav="audio" class="underline">
          <i class="fa-solid fa-headphones"></i>
          <span>Audio</span>
        </a>
        <a href="todo.html" data-nav="todo" class="hover:underline">
          <i class="fa-solid fa-list-check"></i>
          <span>To-Do</span>
        </a>
        <a href="dhikr.html" data-nav="dhikr" class="hover:underline">
          <i class="fa-solid fa-hands-praying"></i>
          <span>Dhikr</span>
        </a>
      </div>

      <!-- NAV RIGHT -->
      <div class="flex items-center gap-1">
        <button id="lang-toggle" class="flex justify-center items-center gap-1 w-14 h-8 rounded-full cursor-pointer hover:bg-hover-sec transition" aria-label="Switch language">
          <span id="lang-label" class="">EN</span>
          <i class="fa-solid fa-globe"></i>
        </button>

        <!-- HAMBURGER MENU FOR MOBILE -->
        <button id="menu-open" class="flex justify-center items-center w-8 h-8 rounded-full cursor-pointer hover:bg-hover-sec transition md:hidden" aria-label="Open menu">
          <i class="fa fa-bars"></i>
        </button>
      </div>
      
    </nav>

    <div id="menu-backdrop" class="hidden fixed inset-0 bg-black/50 z-40 md:hidden"></div>

    <aside id="menu-sidebar" class="fixed top-0 end-0 h-full w-72 bg-primary shadow-xl z-50 translate-x-full rtl:-translate-x-full transition-transform duration-300 ease-in-out md:hidden">

      <!-- Header with close button -->
      <div class="flex items-center justify-between h-15 px-5 border-b border-secondary">
        <img src="../assets/logo-sec.png" class="w-16 md:w-20" alt="tasbirah logo">
        <button id="menu-close" class="text-xl text-secondary flex justify-center items-center w-10 h-10 rounded-full cursor-pointer hover:bg-hover-pri transition" aria-label="Close menu">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Links -->
      <nav class="flex flex-col p-4 gap-1 text-secondary">

        <a href="../index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-hover-pri transition">
          <i class="fa-solid fa-house"></i>
          <span data-i18n="nav.home">Home</span>
        </a>

        <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-hover-pri transition">
          <i class="fa-solid fa-book-quran"></i>
          <span data-i18n="nav.quran">Quran</span>
        </a>

        <a href="#"class="flex items-center gap-3 px-4 py-3 rounded-lg bg-hover-pri transition">
          <i class="fa-solid fa-headphones"></i>
          <span data-i18n="nav.audio">Audio</span>
        </a>

        <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-hover-pri transition">
          <i class="fa-solid fa-list-check"></i>
          <span data-i18n="nav.todo">To-Do</span>
        </a>

        <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-hover-pri transition">
          <i class="fa-solid fa-hands-praying"></i>
          <span data-i18n="nav.dhikr">Dhikr</span>
        </a>

      </nav>
    </aside>
  </header>

  <main class="px-4 py-8 md:px-40 md:py-16">
    <h1 class="text-2xl md:text-3xl font-bold text-secondary mb-6" data-i18n="audio.title">Quran Recordings</h1>
    <hr class="bg-secondary h-px w-full">
    <div id="reciter-list" class="space-y-3">
      <!-- JS renders here -->
    </div>
  </main>

  <script src="../js/app.js"></script>
  <script src="../js/audio.js"></script>
</body>
</html>
